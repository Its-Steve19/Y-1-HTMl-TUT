<!---
Tables & Semantic HTML

1.HTML Tables 
Tables are useful for :
✅Date
✅Timetable
✅Pricing
✅Admin dashboards

2.Table Elements 
<table>    - container
<tr>       -table row 
<td>       -table data
<th>       -table header cell
<thead>   -header section
<tbody>    -body section
<tfoot>    -footer section (optional) - bottom of page

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5-Tables & Semantics </title>
</head>
<body>
    <h1>Day 5:HTML Table</h1>
    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Cake</td>
                <td>$10</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Muffins</td>
                <td>$5</td>
                <td>Out of stock</td>
            </tr>
        </tbody>

    </table>


    <!--
    Semantic HTML
    <header>  - top of page 
    <footer>    -bottom of page 
    <main>      -main content
    <section>   -grouped content
    <article>   -blog post/card content
    <nav>       -navigation menu
    <aside>     -sidebar
    
    -->
</body>
</html>
